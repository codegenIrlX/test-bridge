default:
  database:
    host: postgres
    port: 5432
    name: metrics_srv
    user: metrics_srv
  redis:
    host: redis
    port: 6379
  storage:
    path: /data/imports
    max_archive_bytes: 104857600
    max_uncompressed_bytes: 1073741824
    max_result_files: 10000
  scheduler:
    interval_seconds: 5
  metrics:
    allowed_projects:
      - qa-lab-test-framework

development: {}
