apiVersion: 1

datasources:
  - name: TestBridge PostgreSQL
    uid: testbridge-postgres
    type: postgres
    access: proxy
    url: $TESTBRIDGE_GRAFANA_DATABASE_URL
    user: testbridge_grafana_reader
    secureJsonData:
      password: $TESTBRIDGE_GRAFANA_DATABASE_PASSWORD
    jsonData:
      database: $TESTBRIDGE_GRAFANA_DATABASE_NAME
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 5
      maxIdleConns: 2
    editable: false
