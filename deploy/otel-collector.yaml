receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: testbridge
          scrape_interval: 15s
          authorization:
            type: Bearer
            credentials_file: /run/otel-auth/token
          static_configs:
            - targets: ["api:8000"]

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
